name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '10.0'
            testbench: '8.0'
          - php: '8.2'
            laravel: '10.0'
            testbench: '8.0'
          - php: '8.3'
            laravel: '10.0'
            testbench: '8.0'
          - php: '8.2'
            laravel: '11.0'
            testbench: '9.0'
          - php: '8.3'
            laravel: '11.0'
            testbench: '9.0'
          - php: '8.2'
            laravel: '12.0'
            testbench: '10.0'
          - php: '8.3'
            laravel: '12.0'
            testbench: '10.0'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl, mbstring, pdo_sqlite
          coverage: none
      - run: composer require "laravel/framework:^${{ matrix.laravel }}" "orchestra/testbench:^${{ matrix.testbench }}" --no-update --no-security-blocking
      - run: composer update --prefer-dist --no-interaction --with-all-dependencies --no-security-blocking
      - run: vendor/bin/phpunit
